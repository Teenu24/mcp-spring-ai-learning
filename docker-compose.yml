version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:postgresql://postgres:5432/springmcp
      - DATABASE_USERNAME=springmcp
      - DATABASE_PASSWORD=springmcp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - spring-mcp-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=springmcp
      - POSTGRES_USER=springmcp
      - POSTGRES_PASSWORD=springmcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-mcp-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - spring-mcp-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - spring-mcp-network

volumes:
  postgres_data:

networks:
  spring-mcp-network:
    driver: bridge

---
# Dockerfile
FROM eclipse-temurin:21-jdk-alpine AS builder

WORKDIR /app
COPY pom.xml .
COPY src ./src

RUN ./mvnw clean package -DskipTests

FROM eclipse-temurin:21-jre-alpine

RUN addgroup -g 1001 -S spring && \
    adduser -u 1001 -S spring -G spring

WORKDIR /app
COPY --from=builder /app/target/*.jar app.jar

RUN chown spring:spring app.jar
USER spring

EXPOSE 8080

ENTRYPOINT ["java", "-jar", "app.jar"]
